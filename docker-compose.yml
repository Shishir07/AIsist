services:
  db:
    image: postgres:16
    container_name: aisist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisist}
      POSTGRES_USER: ${POSTGRES_USER:-aisist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisist_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aisist_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisist_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
